<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Kreatifest Indonesia — studio kreatif yang memadukan strategi, desain, dan eksperimen digital."
    />
    <title>Kreatifest Indonesia — Creative Studio</title>

    <!--
      Menentukan tema SEBELUM React dimuat supaya halaman tidak
      berkedip terang → gelap saat pertama dibuka.
      Urutan: pilihan tersimpan → preferensi sistem → terang.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kreatifest-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', saved === 'dark' || saved === 'light' ? saved : system);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
